name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vodm
          POSTGRES_PASSWORD: vodm
          POSTGRES_DB: vodm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vodm -d vodm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Com esta variável os testes usam o Postgres do serviço acima em vez de baixar
      # um Postgres embutido.
      VODM_TEST_DATABASE_URL: postgres://vodm:vodm@localhost:5432/vodm_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verificar formatação
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos fora do gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # No Linux o compilador C existe, então o detector de corrida roda de verdade.
      - name: Testes com detector de corrida
        run: go test -race ./...
